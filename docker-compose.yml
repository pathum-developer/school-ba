services:
  postgres:
    image: postgres:17
    container_name: school-ba-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: school_db
      POSTGRES_USER: elven_user
      POSTGRES_PASSWORD: elven_password
    ports:
      - "5432:5432"
    volumes:
      - C:/elven-code/school/school-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elven_user -d school_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-test:
    image: postgres:17
    container_name: school-ba-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_DB: school_db_test
      POSTGRES_USER: elven_user
      POSTGRES_PASSWORD: elven_password
    ports:
      - "5433:5432"
    # No volume on purpose: test data must not outlive the container.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elven_user -d school_db_test"]
      interval: 10s
      timeout: 5s
      retries: 5
