spring.application.name=school-ba

logging.pattern.console=${CONSOLE_LOG_PATTERN:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %cyan(%msg%n)}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/school_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:elven_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:elven_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=${JPA_OPEN_IN_VIEW:false}
spring.jpa.properties.hibernate.default_batch_fetch_size=${DEFAULT_BATCH_FETCH_SIZE:50}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:true}
spring.jpa.properties.hibernate.jdbc.time_zone=${HIBERNATE_JDBC_TIME_ZONE:UTC}
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:validate}
spring.liquibase.enabled=${LIQUIBASE_ENABLED:true}
spring.liquibase.change-log=${LIQUIBASE_CHANGE_LOG:classpath:db/changelog/db.changelog-master.yaml}
# Run only production-safe reference data by default. Add "demo" explicitly for local/demo datasets.
spring.liquibase.contexts=${LIQUIBASE_CONTEXTS:reference}

app.auth.jwt.issuer=${JWT_ISSUER:school-ba}
app.auth.jwt.audience=${JWT_AUDIENCE:school-ui}
app.auth.jwt.key-id=${JWT_SIGNING_KEY_ID:school-ba-hs256-v1}
app.auth.jwt.signing-key-base64=${JWT_SIGNING_KEY_BASE64:}
app.auth.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:PT10M}
app.auth.session.idle-timeout=${AUTH_SESSION_IDLE_TIMEOUT:PT30M}
app.auth.session.absolute-timeout=${AUTH_SESSION_ABSOLUTE_TIMEOUT:P30D}
app.auth.mfa.challenge-ttl=${AUTH_MFA_CHALLENGE_TTL:PT5M}
app.auth.rate-limit.max-failures=${AUTH_LOGIN_MAX_FAILURES:5}
app.auth.rate-limit.window=${AUTH_LOGIN_FAILURE_WINDOW:PT15M}
app.auth.refresh-cookie.name=${AUTH_REFRESH_COOKIE_NAME:school_refresh}
app.auth.refresh-cookie.secure=${AUTH_REFRESH_COOKIE_SECURE:true}
app.auth.refresh-cookie.same-site=${AUTH_REFRESH_COOKIE_SAME_SITE:Lax}
app.auth.cors.allowed-origins=${AUTH_CORS_ALLOWED_ORIGINS:http://localhost:5173}

spring.docker.compose.lifecycle-management=start-and-stop
spring.docker.compose.start.command=up
spring.docker.compose.stop.command=stop
