# Layered on top of the main application.properties by the "test" profile, so shared settings
# such as CORS origins still resolve. A plain application.properties here would replace the
# main file instead of extending it.

# Dedicated test database from docker-compose.yml, on port 5433.
# This URL must never point at school_db: spring.liquibase.drop-first below erases whatever
# database it resolves to at the start of every test run.
spring.datasource.url=jdbc:postgresql://localhost:5433/school_db_test
spring.datasource.username=elven_user
spring.datasource.password=elven_password

# Rebuild the schema from the changelogs on every run so each run starts from a known state.
spring.liquibase.drop-first=true

# Tests use their own changelog: it includes the production one and then empties every table.
spring.liquibase.change-log=classpath:db/changelog/db.changelog-test.yaml

# The production changelog needs this context for its schema to be complete; the test changelog
# removes the rows it inserts.
spring.liquibase.contexts=reference

# Liquibase owns the schema; Hibernate only verifies that the entity mappings match it.
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=false

# The test database is started by docker compose, not by the application.
spring.docker.compose.enabled=false
